<script>




	console.log("Please Log");
	var source = new EventSource("/orders/stream");
	source.onmessage = (event) => {
		console.log("An event "+event);

		var json = JSON.parse(event.data);
		console.log("JSON "+JSON.stringify(json));
		console.log("UPDATING "+$(`#${json.id}`));
		var row = $(`<h4 class='col-md-12'>Commande # <i>${json.id}</i> | <span><strong>\$\xA0${json.eventName}</strong></span></h4>`);
		$(".orders").prepend(row);
		// $(`#${json.id}`).html(`\$\xA0${json.eventName}`);
	};
</script>
